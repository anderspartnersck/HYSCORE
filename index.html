<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HYSCORE Walk</title>
<meta name="description" content="HYSCORE: walk through the Castle Killscreen arcade off the 101, point-and-click, and play its games in your browser.">
<link rel="icon" href="data/ui/logo-ck.png">
<!-- HYSCORE — THE WALK-THROUGH (point-and-click, Myst-style). Panoramas + pre-rendered moves from
     Blender (Cycles). No libraries: a small WebGL equirect viewer. -->
<style>
  :root { --ink:#efe6ff; --dim:#a99cc8; --neon:#b36bff; --green:#53ff8a; --pink:#ff3fb4; --bg:#07050c; --panel:rgba(14,8,26,.86); }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.35 "Helvetica Neue",Arial,sans-serif; overflow:hidden; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; background:#000; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #gl { cursor:grab; } #gl.drag { cursor:grabbing; }
  #clip { pointer-events:none; opacity:0; }
  #hots { position:absolute; inset:0; pointer-events:none; }
  .hot { position:absolute; transform:translate(-50%,-50%); pointer-events:auto; cursor:pointer; text-align:center; user-select:none; --c:var(--green); }
  .hot .ring { width:44px; height:44px; margin:0 auto; border-radius:50%; border:2px solid var(--green); box-shadow:0 0 14px var(--green), inset 0 0 10px rgba(83,255,138,.5);
               display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--green); background:rgba(0,0,0,.25); transition:transform .15s; }
  .hot.inspect .ring { border-color:var(--pink); color:var(--pink); box-shadow:0 0 14px var(--pink), inset 0 0 10px rgba(255,63,180,.5); width:38px; height:38px; font-size:16px; }
  .hot.cut .ring { border-color:var(--neon); color:var(--neon); box-shadow:0 0 16px var(--neon); }
  /* 1119 room waypoints: a neon floor marker in the room's own sign colour (a diamond, not an app button) + its name lit like a marquee */
  .hot.walk .ring { width:34px; height:34px; border-radius:0; transform:rotate(45deg); border:3px double var(--c); color:var(--c);
                    box-shadow:0 0 12px var(--c), inset 0 0 9px var(--c); background:rgba(6,3,12,.55); font-size:15px; }
  .hot .ring .g { display:block; line-height:1; } .hot.walk .ring .g { transform:rotate(-45deg); }
  .hot.walk.spot .ring { width:24px; height:24px; border-width:2px; border-style:solid; font-size:11px; opacity:.9; }
  .hot.walk:hover .ring { transform:rotate(45deg) scale(1.15); }
  .hot:not(.walk):hover .ring { transform:scale(1.15); }
  .hot.edge .ring { width:30px; height:30px; font-size:18px; opacity:.8; } .hot.walk.edge .ring { width:24px; height:24px; font-size:12px; }
  .hot .lab { position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:7px; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
              color:var(--ink); text-shadow:0 0 6px #000, 0 0 3px #000; white-space:nowrap; opacity:.85; pointer-events:none; }
  .hot .lab b { font-weight:inherit; } .hot .lab i { display:block; font-style:normal; font-size:9px; letter-spacing:.22em; color:var(--dim); margin-top:1px; }
  .hot.walk .lab { font-weight:800; font-size:13px; letter-spacing:.16em; color:#fff; opacity:1; margin-top:12px;
                   text-shadow:0 0 2px #000, 0 0 5px var(--c), 0 0 12px var(--c), 0 1px 2px #000; }
  .hot.walk.spot .lab { font-size:10px; font-weight:700; letter-spacing:.14em; margin-top:9px; text-shadow:0 0 2px #000, 0 0 6px var(--c), 0 1px 2px #000; }
  .hot.flip .lab { top:auto; bottom:100%; margin:0 0 9px; }
  .hot.nolab .lab { display:none; } .hot.nolab:hover .lab { display:block; }
  .hot.edge .lab { font-size:10px; opacity:.8; } .hot.walk.edge .lab { font-size:10px; letter-spacing:.12em; margin-top:8px; }
  #hud { position:absolute; left:14px; top:12px; pointer-events:none; }
  #area { font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:15px; text-shadow:0 0 10px var(--neon); }
  #sub { color:var(--dim); font-size:12px; margin-top:2px; }
  #help { position:absolute; right:14px; top:12px; color:var(--dim); font-size:11px; text-align:right; pointer-events:none; }
  #card { position:absolute; right:16px; bottom:16px; width:min(420px, 46%); background:var(--panel); border:1px solid rgba(179,107,255,.5);
          box-shadow:0 0 24px rgba(179,107,255,.25); border-radius:10px; padding:14px 16px; display:none; }
  #card h2 { margin:0 0 4px; font-size:16px; letter-spacing:.06em; }
  #card .game { color:var(--green); font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  #card p { margin:8px 0; color:var(--ink); }
  #card .ctl { color:var(--dim); font-size:12px; }
  #card ul { margin:8px 0 0; padding-left:18px; color:var(--dim); font-size:12px; }
  #card .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  button { font:inherit; color:var(--ink); background:rgba(179,107,255,.18); border:1px solid var(--neon); border-radius:6px; padding:7px 12px; cursor:pointer; }
  button:hover { background:rgba(179,107,255,.35); }
  button.play { border-color:var(--green); background:rgba(83,255,138,.14); }
  #title { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:7%; pointer-events:none; }
  #title .t { font-size:13px; letter-spacing:.3em; color:var(--dim); text-shadow:0 0 8px #000; opacity:0; transition:opacity 1s; }
  #load { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); color:var(--dim); font-size:11px; letter-spacing:.1em; }
  #skip { position:absolute; right:14px; bottom:12px; display:none; }
  /* 1110 front end (ui.js): logos -> attract -> title -> press -> menu; pause / map / settings */
  .screen { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; z-index:5; }
  .screen.on { display:flex; }
  #fade { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .45s; z-index:4; } #fade.on { opacity:1; }
  body:not([data-mode="walk"]) #hots, body:not([data-mode="walk"]) #hud, body:not([data-mode="walk"]) #help, body:not([data-mode="walk"]) #pausebtn { display:none; }
  #s-logos { background:#000; cursor:pointer; } #s-logos img { width:min(46%, 520px); animation:ckin 2.6s ease both; }
  @keyframes ckin { 0% { opacity:0; filter:brightness(.2); } 25% { opacity:1; filter:brightness(1.4); } 32% { filter:brightness(.6); } 38%,80% { opacity:1; filter:brightness(1); } 100% { opacity:0; } }
  #s-attract, #s-title { cursor:pointer; background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55)); }
  .ttl { font-weight:800; letter-spacing:.32em; font-size:clamp(34px, 8vw, 92px); color:#fff; padding-left:.32em;
         text-shadow:0 0 6px #fff, 0 0 18px var(--pink), 0 0 42px var(--pink), 0 0 80px var(--neon); }
  .ttl-sub { color:var(--dim); letter-spacing:.3em; font-size:12px; margin-top:6px; text-transform:uppercase; text-shadow:0 0 6px #000; }
  .press { margin-top:9%; letter-spacing:.35em; font-size:14px; color:var(--green); text-shadow:0 0 10px var(--green); animation:blink 1.2s steps(2) infinite; }
  #s-attract .ttl { font-size:clamp(20px, 4vw, 44px); opacity:.9; } #s-attract { justify-content:flex-end; padding-bottom:6%; box-sizing:border-box; }
  @keyframes blink { 50% { opacity:.15; } }
  .menu { display:flex; flex-direction:column; gap:10px; min-width:min(320px, 80%); background:var(--panel); border:1px solid rgba(179,107,255,.5);
          box-shadow:0 0 30px rgba(179,107,255,.3); border-radius:12px; padding:22px 26px; }
  .menu h3 { margin:0 0 6px; text-align:center; letter-spacing:.3em; font-size:13px; color:var(--dim); font-weight:600; }
  .menu button { font-size:15px; letter-spacing:.18em; padding:11px 14px; text-align:left; }
  .menu button:focus { outline:none; background:rgba(83,255,138,.18); border-color:var(--green); box-shadow:0 0 12px rgba(83,255,138,.4); }
  .menu .hint { color:var(--dim); font-size:11px; text-align:center; margin-top:4px; letter-spacing:.06em; }
  #s-menu, #s-pause, #s-settings, #s-map { background:rgba(4,2,8,.55); }
  #s-map .menu { min-width:min(820px, 92%); max-height:96%; padding:14px 18px; gap:6px; }
  #map-svg { width:100%; height:min(74vh, 640px); background:#06040b; border-radius:8px; }
  #map-svg .mapnode { cursor:pointer; } #map-svg .mapnode:hover circle { stroke-width:.4; }
  #map-svg text { font-family:"Helvetica Neue",Arial,sans-serif; font-weight:700; letter-spacing:.05em; pointer-events:none; }
  #map-here { color:var(--green); font-size:12px; letter-spacing:.12em; text-align:center; }
  #pausebtn { position:absolute; left:14px; bottom:12px; font-size:12px; padding:5px 10px; opacity:.75; }
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="gl"></canvas>
  <canvas id="clip"></canvas>
  <div id="hots"></div>
  <div id="hud"><div id="area"></div><div id="sub"></div></div>
  <div id="help">drag to look · click a lit room name to walk there · pink = inspect · M = map · Esc = pause</div>
  <div id="card"></div>
  <button id="skip">skip ▸</button>
  <div id="load"></div>
  <button id="pausebtn">❚❚ pause</button>
  <div id="fade"></div>
  <div class="screen" id="s-logos"><img src="data/ui/logo-ck.png" alt="Castle Killscreen"></div>
  <div class="screen" id="s-attract"><div class="ttl">HYSCORE</div><div class="press">PRESS ENTER</div></div>
  <div class="screen" id="s-title"><div class="ttl">HYSCORE</div><div class="ttl-sub">the arcade off the 101</div><div class="press">PRESS ENTER</div></div>
  <div class="screen" id="s-menu"><div class="menu"><h3>HYSCORE</h3>
    <button id="m-enter">▶ ENTER THE ARCADE</button><button id="m-map">⌖ MAP</button><button id="m-settings">⚙ SETTINGS</button><button id="m-quit">⏻ QUIT</button>
    <div class="hint">↑ ↓ choose · Enter select · Esc back</div></div></div>
  <div class="screen" id="s-pause"><div class="menu"><h3>PAUSED</h3>
    <button id="p-resume">▶ RESUME</button><button id="p-map">⌖ MAP</button><button id="p-settings">⚙ SETTINGS</button>
    <button id="p-door">⇤ BACK TO THE DOOR</button><button id="p-title">⏻ QUIT TO TITLE</button></div></div>
  <div class="screen" id="s-settings"><div class="menu"><h3>SETTINGS</h3>
    <button id="set-sound">SOUND · ON</button><button id="set-cuts">CUT SCENES · PLAY</button><button id="set-back">◂ BACK</button>
    <div class="hint">this session only: the web build saves nothing</div></div></div>
  <div class="screen" id="s-map"><div class="menu"><h3>MAP · PICK A ROOM</h3><svg id="map-svg"></svg><div id="map-here"></div>
    <button id="map-back">◂ BACK</button></div></div>
</div></div>
<script src="ckboot.js?v=1"></script>   <!-- CK BOOT STANDARD: audio unlock + unskippable logos -->
<script src="live.js"></script>
<script src="gateway.js"></script>   <!-- 1119: THE GATEWAY atrium variants (data/gateway.json) -->
<script src="walk.js"></script>
<script src="ui.js"></script>
</body>
</html>
